<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Family Dose Check</title>
  <link rel="stylesheet" href="/static/styles.css?v=login4" />
</head>
<body class="login-page">
  <main>
    <section class="rail">
      <p class="eyebrow">Family Dose Check</p>
      <h1>Caregiver sign in</h1>
      <p id="provider-note">Create an account to manage your family’s schedule.</p>
      <form id="auth-form">
        <label>
          Email
          <input name="email" type="email" required autocomplete="username" maxlength="254" />
        </label>
        <label>
          Password (at least 12 characters)
          <input name="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password" />
        </label>
        <label>
          Household name (for a new account)
          <input name="household_name" maxlength="80" placeholder="Sharma family" />
        </label>
        <div class="login-actions">
          <button id="register" type="button">Create household</button>
          <button type="submit">Sign in</button>
        </div>
        <p id="message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
