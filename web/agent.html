<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Dose Check</title>
  <link rel="stylesheet" href="/static/agent.css?v=2" />
</head>
<body>
  <div id="account" class="account" aria-label="Household account"><a class="dev-link" href="/">Caregiver dashboard</a></div>
  <main>
    <p id="status" class="status">Tap the circle to talk</p>
    <button id="orb" type="button" aria-pressed="false" aria-label="Talk">
      <canvas id="waves" width="360" height="360"></canvas>
      <span class="core"></span>
    </button>
    <p id="caption" class="caption" aria-live="polite"></p>
    <ol id="transcript" class="transcript" aria-live="polite"></ol>
  </main>
  <script src="/static/session.js"></script>
  <script src="/static/listener.js?v=1"></script>
  <script src="/static/agent.js?v=3"></script>
</body>
</html>
