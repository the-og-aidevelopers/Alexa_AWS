AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Pillow on AWS: a DynamoDB table, an instance role for the EC2 server (Bedrock and the table), a
  CloudFront https front for the server, and a Cognito user pool for sign-in. The EC2 instance itself is
  created by hand; give its public DNS name as OriginDnsName.

Parameters:
  OriginDnsName:
    Type: String
    Description: Public DNS name of the EC2 instance, for example ec2-3-80-1-2.compute-1.amazonaws.com
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: The Bedrock model that chooses the action.

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pillow
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pillow-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: pillow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*.${BedrockModelId}"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: pillow-ec2
      Roles: [!Ref InstanceRole]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Pillow https front
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: server
            DomainName: !Ref OriginDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          # Managed policies: CachingDisabled, and AllViewer (forwards Host, cookies and headers to the server).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: pillow
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "pillow-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: pillow-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/api/auth/cognito-callback"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/login"]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

Outputs:
  TableName: { Value: !Ref Table }
  InstanceProfileName: { Value: !Ref InstanceProfile, Description: Attach this to the EC2 instance. }
  CloudFrontDomain: { Value: !GetAtt Distribution.DomainName, Description: The public https address. }
  UserPoolId: { Value: !Ref UserPool }
  ClientId: { Value: !Ref UserPoolClient }
  CognitoDomain: { Value: !Sub "pillow-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com" }
